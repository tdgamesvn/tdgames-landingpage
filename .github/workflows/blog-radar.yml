name: 📡 Blog Radar

# Trước đây chạy bằng crontab trên VPS, chết im 5 ngày (2026-08-01 → 08-06) vì
# `git clean -fd` lúc deploy xoá thư mục logs/ → redirect fail, không ai biết.
# Ở đây fail là GitHub gửi mail + hiện đỏ trong tab Actions.

on:
  schedule:
    # 8:00 UTC+7 = 01:00 UTC, hằng ngày
    - cron: "0 1 * * *"
  workflow_dispatch:

jobs:
  radar:
    name: Quét tin ngành → chấm điểm → lưu blog_topics → ping Discord
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: 📡 Chạy radar
        env:
          AI_BASE_URL: ${{ secrets.AI_BASE_URL }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
          AI_MODEL: ${{ secrets.AI_MODEL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: node scripts/blog-radar.mjs
