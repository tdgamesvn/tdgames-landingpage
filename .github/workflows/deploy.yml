name: 🚀 Deploy to VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

# Một build tại một thời điểm. Không cancel-in-progress: kill giữa chừng
# để lại lock trong .next → run sau fail "Another next build process is already running".
concurrency:
  group: deploy-vps
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Landing Page
    runs-on: ubuntu-latest
    steps:
      - name: 🔐 SSH & Deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            set -e
            cd /opt/tdgames-landingpage

            echo "💾 Backing up .env..."
            cp .env /tmp/.env.landingpage.bak 2>/dev/null || true

            echo "🧹 Cleaning git state..."
            git checkout -- . 2>/dev/null || true
            git clean -fd 2>/dev/null || true
            git stash drop 2>/dev/null || true

            echo "📥 Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            echo "💾 Restoring .env..."
            cp /tmp/.env.landingpage.bak .env 2>/dev/null || true

            echo "📦 Installing dependencies..."
            npm install --production=false

            # Build đè lên .next cũ có thể để lại artifact lai (thiếu client
            # reference manifest → toàn site 500). Xoá sạch, giữ lại .next/cache
            # để build vẫn nhanh.
            echo "🧹 Xoá build cũ (giữ cache)..."
            find .next -mindepth 1 -maxdepth 1 ! -name cache -exec rm -rf {} + 2>/dev/null || true

            echo "🔨 Building..."
            npm run build

            echo "🔄 Restarting PM2..."
            pm2 restart tdgames-landingpage || pm2 start ecosystem.config.js
            pm2 save

            echo "✅ Deploy completed at $(date)"
